<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0c1830">
  <meta name="description" content="Forgefall — puzzle match-3 e tower defense di Medusa Games.">
  <title>Forgefall — Medusa Games</title>
  <link rel="stylesheet" href="game.css">
  <script defer src="game.js"></script>
</head>
<body>
  <main id="game-root" class="game-root">
    <canvas id="game-canvas" aria-label="Forgefall: crea difese fondendo tre materiali uguali e difendi il castello dalle orde."></canvas>

    <div class="top-actions" aria-label="Comandi principali">
      <a class="round-button" href="../../index.html" aria-label="Torna a Medusa Games">←</a>
      <div class="wordmark"><small>MEDUSA GAMES / 01</small><strong>FORGEFALL</strong></div>
      <button id="sound-btn" class="round-button" type="button" aria-pressed="false" aria-label="Attiva audio">♪</button>
    </div>

    <div id="selection-actions" class="selection-actions" hidden>
      <div class="selected-name"><span id="selected-kicker">SELEZIONATO</span><strong id="selected-name">—</strong></div>
      <button id="info-btn" class="action-button info" type="button">INFO</button>
      <button id="open-chest-btn" class="action-button chest" type="button" hidden>APRI CASSA</button>
    </div>

    <div class="bottom-actions">
      <button id="workshop-btn" class="action-button workshop" type="button" hidden>TERMINA OFFICINA</button>
      <button id="restart-btn" class="mini-button" type="button">RICOMINCIA</button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="info-dialog" class="info-dialog">
      <button id="info-close" class="dialog-close" type="button" aria-label="Chiudi">×</button>
      <div class="info-heading">
        <div id="info-sprite" class="info-sprite"></div>
        <div>
          <small id="info-kind">MATERIALE</small>
          <h2 id="info-title">—</h2>
          <p id="info-subtitle">—</p>
        </div>
      </div>
      <div id="info-description" class="info-description"></div>
      <div id="info-stats" class="info-stats"></div>
      <p class="info-tip">Suggerimento: tre elementi identici e adiacenti si fondono. Tre difese dello stesso livello creano il livello successivo.</p>
    </dialog>

    <dialog id="gameover-dialog" class="gameover-dialog">
      <small>IL BASTIONE È CADUTO</small>
      <h2>Giorno <span id="final-day">1</span></h2>
      <p>Punteggio finale <strong id="final-score">0</strong></p>
      <div class="dialog-actions">
        <button id="again-btn" class="action-button" type="button">RIPROVA</button>
        <a href="../../index.html" class="action-button ghost">HOME</a>
      </div>
    </dialog>
  </main>
</body>
</html>
